[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NODE_ENV = "production"
  # [09.11.2026] AUFTRAG-122 K8 / Inhaber-Freigabe Live: Die KI-Demo zeigt im Telefon «Anruf von …».
  # peoplefone setzt als Absender die Portal-Ausgangsnummer 052 222 18 18 (oeffentliche Hauptnummer),
  # nicht die KI-Linie. Ohne Variable stuende dort +41 44 552 03 06 und der Besucher saehe eine andere
  # Nummer als auf seinem Handy. Wird beim Build eingesetzt (Telefon.tsx, ANRUF_VON).
  NEXT_PUBLIC_DEMO_ANRUF_VON = "052 222 18 18"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  # Only include Next.js server artifacts, NOT node_modules (Netlify installs those automatically)
  included_files = [
    ".next/server/**",
    ".next/required-server-files.json",
    "package.json"
  ]

# [01.11.2026] AUFTRAG-116: IndexNow-Ping nach erfolgreichem Produktions-Deploy (netlify/functions/deploy-succeeded.mts).
# Eigene leere included_files, damit die globalen Next-Artefakte diese Mini-Funktion nicht aufblaehen.
[functions."deploy-succeeded"]
  included_files = []
